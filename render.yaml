# Render Blueprint for the chatbot backend (https://render.com/docs/blueprint-spec).
services:
  - type: web
    name: chatboot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.5"
      - key: OPENAI_MODEL
        value: gpt-4
      - key: ALLOWED_ORIGINS
        value: https://mounir-ben-ammar.github.io
      - key: OPENAI_API_KEY
        sync: false   # secret: entered in the Render dashboard, never committed
